<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Header Profile & Time -->
        <header class="profile-card">
            <div class="user-info">
                <img src="assets/images/profile.png" alt="Foto Profil" class="avatar" id="userAvatar" />
                <div class="user-details">
                    <h2 id="userName">Ahmad Darussalam</h2>
                    <p id="userRole">Software Engineer</p>
                </div>
            </div>
            <div class="time-display">
                <div class="day" id="currentDay">Minggu</div>
                <div class="date" id="currentDate">2 Agustus 2026</div>
            </div>
        </header>

        <!-- Form Input Task -->
        <section class="task-form-card">
            <h3>Tambah Tugas Baru</h3>
            <form id="todoForm">
                <div class="form-group">
                    <label for="taskInput">Deskripsi Tugas</label>
                    <textarea id="taskInput" placeholder="Tuliskan tugas harianmu di sini..." rows="3" required></textarea>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="prioritySelect">Level Prioritas</label>
                        <select id="prioritySelect" required>
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="dueDateInput">Batas Waktu (Deadline)</label>
                        <input type="datetime-local" id="dueDateInput" required>
                    </div>
                </div>

                <button type="submit" id="btnSubmit" class="btn btn-primary">Tambah Tugas</button>
            </form>
        </section>

        <!-- Main Task List Section -->
        <main class="content-grid">
            <!-- Active To-Do List Table -->
            <section class="card">
                <div class="card-header">
                    <h3>Daftar To-Do (<span id="todoCount">0</span>)</h3>
                    <button id="btnDeleteAll" class="btn btn-danger-sm">Hapus Semua</button>
                </div>
                <div class="table-responsive">
                    <table class="todo-table">
                        <thead>
                            <tr>
                                <th>Status</th>
                                <th>Tugas</th>
                                <th>Prioritas</th>
                                <th>Waktu Dibuat / Deadline</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="todoTableBody">
                           
                        </tbody>
                    </table>
                </div>
                <div id="emptyTodoMsg" class="empty-state">Belum ada tugas aktif. Selesai semua!</div>
            </section>

            <!-- Done List Section -->
            <section class="card">
                <div class="card-header">
                    <h3>Selesai / Done (<span id="doneCount">0</span>)</h3>
                </div>
                <ul id="doneList" class="done-list">
                   
                </ul>
                <div id="emptyDoneMsg" class="empty-state">Belum ada tugas yang diselesaikan.</div>
            </section>
        </main>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
